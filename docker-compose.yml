
x-base-env: &base-env
  DATABASE_SUCCESS_URL: http://database:8888/payments
  DATABASE_SUMMARY_URL: http://database:8888/payments-summary
  DATABASE_PURGE_URL: http://database:8888/purge-payments

services:
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: '0.006'
          memory: '30MB'

  payments-service: &payments-service
    image: joycegodinhoo/payments-service:latest
    container_name: payments-service
    ports:
      - "8086:8086"
    environment:
      <<: *base-env
      SERVICE_NUMBER: 1
      PORT: 8086
    volumes:
      - ./:/pps/
    working_dir: /pps
    depends_on:
      - redis
      - database
    networks:
      - backend
      - payment-processor
    deploy:
      resources:
        limits:
          cpus: '0.742'
          memory: '70MB'

  payments-service-2:
    <<: *payments-service
    image: joycegodinhoo/payments-service:latest
    container_name: payments-service-2
    environment:
      <<: *base-env
      SERVICE_NUMBER: 2
      PORT: 8087
    ports:
      - "8087:8087"
    volumes:
      - ./:/pps2/
    working_dir: /pps2/
    depends_on:
      - redis
      - database
    networks:
      - backend
      - payment-processor
    deploy:
      resources:
        limits:
          cpus: '0.742'
          memory: '70MB'

  load-balancer-backend:
    image: joycegodinhoo/load-balancer-backend:latest
    ports:
      - "9999:9999"
    environment:
      - PORT=9999
      - FIRST_SERVER_HOST=payments-service
      - FIRST_SERVER_PORT=8086
      - SECOND_SERVER_HOST=payments-service-2
      - SECOND_SERVER_PORT=8087
    volumes:
      - ./:/lbb/
    depends_on:
      - payments-service
      - payments-service-2
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: '0.005'
          memory: '80MB'

  database:
    image: joycegodinhoo/database:latest
    ports:
      - "8888:8888"
    environment:
      - PORT=8888
    volumes:
      - ./:/db/
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: '0.005'
          memory: '100MB'

networks:
  backend:
    driver: bridge
  payment-processor:
    external: true

x-base-env: &base-env
  DB_SOCKET_PATH: /sockets/database.sock

services:
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - backend

  payments-service: &payments-service
    build:
      context: .
      target: dev
      dockerfile: payments-service/Dockerfile
    environment:
      <<: *base-env
      SERVICE_NUMBER: 1
      SOCKET_PATH: /sockets/payments-service-1.sock
    volumes:
      - ./:/pps/
      - sockets-volume:/sockets
    working_dir: /pps
    depends_on:
      - redis
      - database
    networks:
      - backend
      - payment-processor


  payments-service-2:
    <<: *payments-service
    build:
      context: .
      target: dev
      dockerfile: payments-service/Dockerfile.service2
    environment:
      <<: *base-env
      SERVICE_NUMBER: 2
      SOCKET_PATH: /sockets/payments-service-2.sock
    volumes:
      - ./:/pps2/
      - sockets-volume:/sockets
    working_dir: /pps2/
    depends_on:
      - redis
      - database
    networks:
      - backend
      - payment-processor

  load-balancer-backend:
    build:
      context: .
      target: dev
      dockerfile: load-balancer-backend/Dockerfile
    ports:
      - "9999:9999"
    environment:
      - PORT=9999
      - SOCKET1_PATH=/sockets/payments-service-1.sock
      - SOCKET2_PATH=/sockets/payments-service-2.sock
    volumes:
      - ./:/lbb/
      - sockets-volume:/sockets
    depends_on:
      - payments-service
      - payments-service-2
    networks:
      - backend

  database:
    build:
      context: .
      target: dev
      dockerfile: database/Dockerfile
    environment:
      - SOCKET_PATH=/sockets/database.sock
    volumes:
      - ./:/db/
      - sockets-volume:/sockets
    networks:
      - backend


networks:
  backend:
    driver: bridge
  payment-processor:
    external: true

volumes:
  sockets-volume:
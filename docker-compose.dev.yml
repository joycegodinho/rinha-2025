
x-base-env: &base-env
  DATABASE_SUCCESS_URL: http://database:8888/payments
  DATABASE_SUMMARY_URL: http://database:8888/payments-summary
  DATABASE_PURGE_URL: http://database:8888/purge-payments

services:
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - backend
  payments-service: &payments-service
    build:
      context: .
      target: dev
      dockerfile: payments-service/Dockerfile
    ports:
      - "8086:8086"
    environment:
      <<: *base-env
      SERVICE_NUMBER: 1
      PORT: 8086
    volumes:
      - ./:/pps/
    working_dir: /pps
    depends_on:
      - redis
      - database
    networks:
      - backend
      - payment-processor

  payments-service-2:
    <<: *payments-service
    build:
      context: .
      target: dev
      dockerfile: payments-service/Dockerfile.service2
    environment:
      <<: *base-env
      SERVICE_NUMBER: 2
      PORT: 8087
    ports:
      - "8087:8087"
    volumes:
      - ./:/pps2/
    working_dir: /pps2
    depends_on:
      - redis
      - database
    networks:
      - backend
      - payment-processor

  load-balancer-backend:
    build:
      context: .
      target: dev
      dockerfile: load-balancer-backend/Dockerfile
    ports:
      - "9999:9999"
    environment:
      - PORT=9999
      - FIRST_SERVER_HOST=payments-service
      - FIRST_SERVER_PORT=8086
      - SECOND_SERVER_HOST=payments-service-2
      - SECOND_SERVER_PORT=8087
    volumes:
      - ./:/lbb/
    depends_on:
      - payments-service
      - payments-service-2
    networks:
      - backend

  database:
    build:
      context: .
      target: dev
      dockerfile: database/Dockerfile
    ports:
      - "8888:8888"
    environment:
      - PORT=8888
    volumes:
      - ./:/db/
    networks:
      - backend

networks:
  backend:
    driver: bridge
  payment-processor:
    external: true
